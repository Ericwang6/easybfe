# Configuration file for the one-line plain MD pipeline (MDPipelineConfig):
# parameterize the ligand -> build the solvated system -> run MD -> analyze.
# Verified end to end on TYK2 (protein-only, ligand-only, complex; 1 ns each on an A100).
#
# Protein and ligand are usually passed on the command line; give either or both:
#   easybfe md pipeline config_md_1ns.yaml -p protein.pdb -l ligand.sdf -o run_complex
#   easybfe md pipeline config_md_1ns.yaml -p protein.pdb               -o run_protein
#   easybfe md pipeline config_md_1ns.yaml                -l ligand.sdf -o run_ligand
# They (and output_dir) can instead be set here as protein: / ligand: / output_dir:.
# Protocol: minimization -> 50 ps NVT (restrained, 2 fs) -> 50 ps NPT (restrained, 4 fs)
#           -> 1 ns unrestrained NPT production (4 fs, 100 frames).

# Ligand parameterization, used when -l is a raw file (SDF, ...). A parameterized
# ligand directory or .ligpack is used as is.
ligand_param:
  forcefield: gaff2
  charge_method: bcc

# System setup + ordered MD workflow (AmberSimulationConfig).
simulation:
  box_shape: dodecahedron
  buffer: 15.0          # solvent padding (Angstrom)
  neutralize: true
  ionic_strength: 0.15  # molar
  do_hmr: true          # needed for the 4 fs stages
  hydrogen_mass: 3.024
  water_model: tip3p
  protein_ff:
  - ff14sb
  water_ff:
  - tip3p
  basename: system
  workflow:
  - type: em
    name: 01.em
    exec: pmemd.cuda
    use_remd: false
    use_mpi: false
    cntrl:
      maxcyc: 2000
      ofreq: 100
      efreq: 100
  - type: heat
    name: 02.nvt
    exec: pmemd.cuda
    use_remd: false
    use_mpi: false
    cntrl:
      dt: 0.002
      num_steps: 25000     # 50 ps
      restraint_wt: 5.0
      ofreq: 5000
      efreq: 5000
  - type: pres
    name: 03.npt
    exec: pmemd.cuda
    use_remd: false
    use_mpi: false
    cntrl:
      dt: 0.004
      num_steps: 12500     # 50 ps
      restraint_wt: 5.0
      ofreq: 2500
      efreq: 2500
  - type: prod
    name: 04.prod
    exec: pmemd.cuda
    use_remd: false
    use_mpi: false
    cntrl:
      dt: 0.004
      num_steps: 250000    # 1 ns
      ofreq: 2500          # 100 frames
      efreq: 2500

# Trajectory analysis (PlainMDAnalysisConfig). Unset fields default per system type:
# RMSD on the ligand (ligand / complex) or backbone (protein); interaction analysis
# and GBSA only for a complex.
analysis: {}
